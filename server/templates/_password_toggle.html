{# Show / hide password button for the standalone auth pages (login, signup, reset-password).
   Wraps every password input in .auth__pw and adds an eye button (44x44 touch target). #}
<style>
  .auth__pw { position: relative; display: block; }
  .auth__pw .auth__input { width: 100%; padding-right: 3.4rem; }
  .auth__input + .auth__pw, .auth__pw + .auth__pw, .auth__pw + .auth__input { margin-top: -1px; }
  .auth__eye {
    position: absolute; top: 50%; right: 2px; transform: translateY(-50%);
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    background: none; border: 0; padding: 0; cursor: pointer; color: rgba(233, 219, 144, 0.55);
    transition: color 0.2s ease;
  }
  .auth__eye:hover, .auth__eye:focus-visible { color: #e9db90; }
  .auth__eye:focus-visible { outline: 1px solid rgba(233, 219, 144, 0.6); outline-offset: -6px; }
  .auth__eye svg { width: 18px; height: 18px; }
  .auth__eye .eye-off { display: none; }
  .auth__eye[aria-pressed="true"] .eye-on { display: none; }
  .auth__eye[aria-pressed="true"] .eye-off { display: block; }
</style>
<script>
  (function () {
    var EYE = '<svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg>' +
              '<svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 4.5c6.5 0 10.5 7.5 10.5 7.5a17 17 0 0 1-3.2 4.1M6.3 6.4C3.3 8.4 1.5 12 1.5 12s4 7.5 10.5 7.5c1.6 0 3-.4 4.3-1M9.9 9.9a3.2 3.2 0 0 0 4.3 4.3"/></svg>';
    function init() {
      document.querySelectorAll('input.auth__input[type="password"]').forEach(function (input) {
        if (input.dataset.eye) return;
        input.dataset.eye = '1';
        var wrap = document.createElement('span');
        wrap.className = 'auth__pw';
        input.parentNode.insertBefore(wrap, input);
        wrap.appendChild(input);
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'auth__eye';
        btn.setAttribute('aria-label', 'Show password');
        btn.setAttribute('aria-pressed', 'false');
        btn.innerHTML = EYE;
        btn.addEventListener('click', function () {
          var show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          btn.setAttribute('aria-pressed', show ? 'true' : 'false');
          btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
        });
        wrap.appendChild(btn);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  })();
</script>
